<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="sectionCard(section)" class="section-card" th:aria-labelledby="${section.id + '-heading'}">
    <span class="eyebrow" aria-hidden="true" th:text="#{${section.titleKey()}}"></span>
    <svg th:if="${section.published}" class="card-preview" viewBox="0 0 160 116" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor">
            <rect x="1" y="1" width="158" height="114" rx="3"/>
            <path d="M1 17H159"/><circle cx="9" cy="9" r="2"/><circle cx="17" cy="9" r="2"/>
            <g th:if="${section.id == 'tools'}"><path d="M18 30V100 M18 40H35 M18 60H35 M18 80H35"/><rect x="40" y="33" width="70" height="10"/><rect x="40" y="53" width="100" height="10"/><rect x="40" y="73" width="85" height="10"/></g>
            <g th:unless="${section.id == 'tools'}"><rect x="12" y="27" width="136" height="20"/><rect x="12" y="55" width="136" height="20"/><rect x="12" y="83" width="136" height="20"/><path d="M24 37H38 M48 37H127 M24 65H38 M48 65H112 M24 93H38 M48 93H120"/></g>
        </g>
    </svg>
    <h2 th:id="${section.id + '-heading'}">
        <a th:if="${section.published}" th:href="@{${section.path}(lang=${language})}" th:text="#{${section.titleKey()}}"></a>
        <span th:unless="${section.published}" th:text="#{${section.titleKey()}}"></span>
    </h2>
    <p th:text="#{${section.descriptionKey()}}"></p>
    <p class="status" th:unless="${section.published}" th:text="#{home.unavailable}"></p>
</article>
<button th:fragment="button(labelKey, disabled)" class="button" type="button" th:disabled="${disabled}" th:text="#{${labelKey}}"></button>
</body>
</html>
