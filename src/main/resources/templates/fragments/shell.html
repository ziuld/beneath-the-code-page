<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header page">
    <a class="wordmark" href="/" aria-current="page" th:text="#{brand.name}"></a>
    <nav th:aria-label="#{navigation.label}">
        <ul class="navigation">
            <li><a href="/" aria-current="page" th:text="#{navigation.home}"></a></li>
            <li th:each="section : ${sections}">
                <a th:if="${section.published}" th:href="${section.path}" th:text="#{${section.titleKey()}}"></a>
                <span th:unless="${section.published}" class="unavailable" th:text="#{${section.titleKey()}}"></span>
            </li>
        </ul>
    </nav>
</header>
<footer th:fragment="footer" class="site-footer page">
    <p th:text="#{brand.name}"></p>
    <p th:text="#{footer.statement}"></p>
</footer>
</body>
</html>
