<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${language}">
<head th:replace="~{fragments/learning :: head(#{learning.title})}"></head>
<body>
<a class="skip-link" href="#main" th:text="#{navigation.skip}"></a>
<header th:replace="~{fragments/shell :: header(${currentPath})}"></header>
<main id="main" class="page learn-page" tabindex="-1">
    <section class="page-hero learning-hero">
        <p class="eyebrow" th:text="#{learning.title}"></p>
        <h1 th:text="#{learn.heading}"></h1>
        <p class="intro" th:text="#{home.learn.description}"></p>
        <span class="brand-watermark" aria-hidden="true">B</span>
    </section>
    <div class="learning-grid">
        <section class="section-card course-summary">
            <p class="eyebrow" th:text="#{learning.growing}"></p>
            <h2><a th:href="@{/learn/java-fundamentals(lang=${language})}" th:text="${course.title}"></a></h2>
            <p th:text="${course.summary}"></p>
            <p class="status" th:text="#{learning.available(${#lists.size(units)})}"></p>
            <a class="button button--primary" th:href="@{/learn/java-fundamentals(lang=${language})}" th:text="#{action.exploreCourse}"></a>
        </section>
        <ol th:replace="~{fragments/learning :: unitList}"></ol>
    </div>
</main>
<footer th:replace="~{fragments/shell :: footer}"></footer>
</body></html>
