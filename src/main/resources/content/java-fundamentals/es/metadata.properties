course.title=Fundamentos de Java
course.summary=Lee tres unidades: del código fuente a la JVM; valores, tipos y límites numéricos; flujo de control y trazas. No es el curso completo de Fundamentos de Java.
course.prerequisites=No necesitas conocimientos previos de Java ni instalarlo para empezar a leer. Sigue las unidades en orden. Para reproducir los ejemplos, utiliza el JDK 25 y comandos básicos de archivos y terminal.
course.outcomes=Distinguir código fuente, bytecode y ejecución en la JVM; predecir cálculos con enteros; distinguir valores primitivos y referencias; trazar bifurcaciones, límites y terminación de bucles.
unit.source-to-jvm.title=Del código fuente de Java a la JVM
unit.values-types-numeric-limits.title=Valores, tipos y límites numéricos
unit.control-flow-tracing.title=Flujo de control y trazas
