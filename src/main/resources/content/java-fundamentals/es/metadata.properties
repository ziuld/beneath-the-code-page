course.title=Fundamentos de Java
course.summary=Empieza con una unidad completa sobre cómo el código fuente de Java se convierte en un programa en ejecución. Las demás unidades del curso aún no están disponibles.
course.prerequisites=No necesitas conocimientos previos de Java ni instalarlo para leer esta unidad. Para reproducir el ejemplo, utiliza el JDK 25 y comandos básicos de archivos y terminal.
course.outcomes=Distinguir el código fuente, el bytecode y la ejecución en la JVM; explicar la diferencia entre javac y java y el papel del JDK; predecir por qué cambiar el código fuente sin recompilar no modifica el resultado ejecutado.
unit.source-to-jvm.title=Del código fuente de Java a la JVM
