course.title=Fundamentos de Java
course.summary=Lee dos unidades completas: del código fuente de Java a la ejecución en la JVM y, después, valores, tipos y límites numéricos. No es el curso completo de Fundamentos de Java.
course.prerequisites=No necesitas conocimientos previos de Java ni instalarlo para empezar a leer. Sigue las unidades en orden. Para reproducir los ejemplos, utiliza el JDK 25 y comandos básicos de archivos y terminal.
course.outcomes=Distinguir código fuente, bytecode y ejecución en la JVM; explicar compilación frente a ejecución; predecir desbordamientos, ampliaciones y divisiones; distinguir valores primitivos y referencias.
unit.source-to-jvm.title=Del código fuente de Java a la JVM
unit.values-types-numeric-limits.title=Valores, tipos y límites numéricos
