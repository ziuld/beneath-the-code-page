course.title=Les bases de Java
course.summary=Commencez par une unité complète sur le passage du code source Java à un programme en cours d’exécution. Les autres unités du cours ne sont pas encore disponibles.
course.prerequisites=Aucune connaissance préalable de Java ni installation n’est nécessaire pour lire cette unité. Pour reproduire l’exemple, utilisez le JDK 25 et les commandes élémentaires de gestion des fichiers et du terminal.
course.outcomes=Distinguer le code source, le bytecode et l’exécution par la JVM ; expliquer la différence entre javac et java et le rôle du JDK ; prévoir pourquoi modifier le code source sans le recompiler ne change pas le résultat exécuté.
unit.source-to-jvm.title=Du code source Java à la JVM
