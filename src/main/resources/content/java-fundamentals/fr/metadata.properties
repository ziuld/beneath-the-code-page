course.title=Les bases de Java
course.summary=Lisez deux unités complètes : du code source Java à l’exécution par la JVM, puis les valeurs, types et limites numériques. Il ne s’agit pas du cours complet sur les bases de Java.
course.prerequisites=Aucune connaissance préalable de Java ni installation n’est nécessaire pour commencer à lire. Suivez les unités dans l’ordre. Pour reproduire les exemples, utilisez le JDK 25 et les commandes élémentaires de gestion des fichiers et du terminal.
course.outcomes=Distinguer code source, bytecode et exécution par la JVM ; expliquer compilation et exécution ; prévoir dépassements, élargissements et divisions ; distinguer valeurs primitives et références.
unit.source-to-jvm.title=Du code source Java à la JVM
unit.values-types-numeric-limits.title=Valeurs, types et limites numériques
