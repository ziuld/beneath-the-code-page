course.title=Les bases de Java
course.summary=Lisez trois unités : du code source à la JVM ; valeurs, types et limites numériques ; flot de contrôle et traces d’exécution. Il ne s’agit pas du cours complet sur les bases de Java.
course.prerequisites=Aucune connaissance préalable de Java ni installation n’est nécessaire pour commencer à lire. Suivez les unités dans l’ordre. Pour reproduire les exemples, utilisez le JDK 25 et les commandes élémentaires de gestion des fichiers et du terminal.
course.outcomes=Distinguer code source, bytecode et exécution par la JVM ; prévoir les calculs entiers ; distinguer valeurs primitives et références ; tracer les branchements, les bornes et la terminaison des boucles.
unit.source-to-jvm.title=Du code source Java à la JVM
unit.values-types-numeric-limits.title=Valeurs, types et limites numériques
unit.control-flow-tracing.title=Flot de contrôle et traces d’exécution
