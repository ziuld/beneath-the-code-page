course.title=Java Fundamentals
course.summary=Read two complete units: from Java source to JVM execution, then values, types and numeric limits. This is not the complete Java Fundamentals course.
course.prerequisites=No prior Java knowledge or installation is needed to start reading. Follow the units in order. To reproduce the examples, use JDK 25 and basic file and terminal commands.
course.outcomes=Distinguish source, bytecode and JVM execution; explain compilation versus execution; predict integer overflow, widening and division; distinguish primitive values from references.
unit.source-to-jvm.title=From Java source to the JVM
unit.values-types-numeric-limits.title=Values, types and numeric limits
