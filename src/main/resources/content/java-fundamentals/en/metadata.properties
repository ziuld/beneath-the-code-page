course.title=Java Fundamentals
course.summary=Read three units: source to JVM execution; values, types and numeric limits; control flow and tracing. This is not the complete Java Fundamentals course.
course.prerequisites=No prior Java knowledge or installation is needed to start reading. Follow the units in order. To reproduce the examples, use JDK 25 and basic file and terminal commands.
course.outcomes=Distinguish source, bytecode and JVM execution; predict integer calculations; distinguish primitive values from references; trace branches, loop boundaries and termination.
unit.source-to-jvm.title=From Java source to the JVM
unit.values-types-numeric-limits.title=Values, types and numeric limits
unit.control-flow-tracing.title=Control flow and tracing
