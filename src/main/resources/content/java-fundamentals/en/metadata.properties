course.title=Java Fundamentals
course.summary=Start with one complete unit on how Java source becomes a running program. Further course units are not yet available.
course.prerequisites=No prior Java knowledge or installation is needed to read this unit. To reproduce the example, use JDK 25 and basic file and terminal commands.
course.outcomes=Distinguish source code, bytecode and JVM execution; explain javac versus java and the role of the JDK; predict why changing source without recompiling leaves the executed result unchanged.
unit.source-to-jvm.title=From Java source to the JVM
