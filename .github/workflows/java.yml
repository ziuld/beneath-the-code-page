name: Java baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Temurin 25.0.4.1+1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS' # Adoptium SemVer for jdk-25.0.4.1+1
          architecture: x64
          overwrite-settings: false
      - name: Record toolchain
        run: |
          java -version
          javac -version
          ./mvnw --version
      - name: Verify Java and architecture
        run: python3 scripts/verify-java-baseline.py
      - name: Smoke the executable JAR
        run: python3 scripts/smoke-java-baseline.py
      - name: Validate canonical planning
        run: |
          python3 scripts/check-planning.py
          python3 scripts/test-planning-rules.py
