name: Docker verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Docker build, runtime and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify source inside Docker
        run: docker build --platform linux/amd64 --progress plain -t beneath-the-code:f20 .
      - name: Verify non-root runtime, HTTP journeys and shutdown
        run: python3 scripts/verify-container.py
      - name: Install pinned project-local security tools
        run: python3 scripts/install-security-tools.py
      - name: Test image-security gate policy
        run: python3 scripts/test-container-security.py
      - name: Verify image inventory, vulnerabilities and SBOM
        run: python3 scripts/verify-container-security.py
